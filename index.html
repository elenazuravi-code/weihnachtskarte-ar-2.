<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizza Bilderkennung Test</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>body{margin:0;overflow:hidden;font-family:Arial,sans-serif}#status{position:fixed;top:env(safe-area-inset-top,12px);left:50%;transform:translateX(-50%);z-index:9999;background:#333;color:white;padding:12px 18px;border-radius:12px;text-align:center;min-width:190px}#status.found{background:#138a36}#status.lost{background:#9b3131}</style>
</head>
<body>
<div id="status">Kamera wird gestartet …</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets></a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>
<script>
const status=document.getElementById('status');
const scene=document.querySelector('a-scene');
const target=document.getElementById('target');
scene.addEventListener('arReady',()=>{status.textContent='Kamera bereit – Pizza zeigen';});
scene.addEventListener('arError',()=>{status.textContent='Kamera/Target Fehler';status.className='lost';});
target.addEventListener('targetFound',()=>{status.textContent='✓ Pizza erkannt!';status.className='found';});
target.addEventListener('targetLost',()=>{status.textContent='Pizza nicht im Bild';status.className='lost';});
</script>
</body>
</html>
