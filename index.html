<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weihnachtskarte AR 2</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#status{position:fixed;z-index:9999;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;background:rgba(0,0,0,.75);color:white;border-radius:10px;padding:12px;text-align:center;font-size:14px;pointer-events:none}
#start{position:fixed;z-index:10000;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%);border:0;border-radius:28px;background:#f73598;color:#fff;font-size:16px;font-weight:600;padding:15px 24px;white-space:nowrap}
/* Do not override MindAR/A-Frame camera video and canvas sizing: the library manages these. */
</style></head><body>
<div id="status">Kamera wird gestartet …</div><button id="start">Animation aktivieren</button>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;" embedded color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: false; alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-assets><video id="clip" src="./animation.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0"><a-plane id="screen" position="0 0 0.005" width="1" height="1.414516" material="shader: flat; src: #clip; side: double; transparent: false"></a-plane></a-entity>
</a-scene>
<script>
const video=document.querySelector('#clip'),target=document.querySelector('#target'),status=document.querySelector('#status'),button=document.querySelector('#start');let enabled=false,found=false;
button.addEventListener('click',async()=>{enabled=true;try{await video.play();if(!found)video.pause();button.style.display='none';status.textContent=found?'Bild erkannt – Animation läuft':'Bereit – Kamera auf die Karte richten';}catch(e){status.textContent='Video konnte nicht gestartet werden: '+e.message;}});
target.addEventListener('targetFound',async()=>{found=true;status.textContent=enabled?'Bild erkannt – Animation läuft':'Bild erkannt – unten Animation aktivieren';if(enabled){try{await video.play()}catch(e){status.textContent='Zum Abspielen unten tippen';button.style.display='block'}}});
target.addEventListener('targetLost',()=>{found=false;video.pause();status.textContent='Karte nicht erkannt – Kamera darauf richten'});
document.querySelector('a-scene').addEventListener('arReady',()=>{status.textContent='Kamera bereit – Karte ins Bild halten'});
document.querySelector('a-scene').addEventListener('arError',()=>{status.textContent='AR-Fehler: Kamera-Berechtigung und HTTPS prüfen'});
</script></body></html>
