<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pizza – AR Animationstest</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;font-family:system-ui,sans-serif}
#status{position:fixed;z-index:9999;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;background:#181818e8;color:white;border-radius:9px;padding:10px;font-size:14px;text-align:center;pointer-events:none}
#start{position:fixed;z-index:10000;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 24px;border:0;border-radius:12px;background:white;color:#111;font-size:18px;cursor:pointer}
</style></head><body>
<div id="status">Pizza · Kamera starten und Vorderseite anvisieren</div>
<button id="start">Kamera & Animation starten</button>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: no; uiError: yes" color-space="sRGB" renderer="colorManagement: true; alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-assets><video id="animation" src="./animation2_iphone.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0"><a-video src="#animation" width="1" height="1.41224" position="0 0 0.001" material="shader: flat; side: double"></a-video></a-entity>
</a-scene>
<script>
const status=document.getElementById('status'),button=document.getElementById('start'),scene=document.querySelector('a-scene'),target=document.getElementById('target'),video=document.getElementById('animation');
let found=false,starting=false,started=false;
video.muted=true;video.playsInline=true;
async function playVideo(){try{await video.play();if(!found)video.pause();}catch(e){status.textContent='Karte erkannt – bitte Animation starten antippen';button.textContent='Animation starten';button.hidden=false;}}
button.addEventListener('click',async()=>{
 if(starting)return;
 if(started){button.hidden=true;await playVideo();return;}
 if(!scene.hasLoaded){status.textContent='AR wird geladen – bitte gleich nochmals antippen';return;}
 starting=true;button.hidden=true;status.textContent='Kamera startet …';
 const unlock=video.play();if(unlock)unlock.then(()=>{if(!found)video.pause();}).catch(()=>{});
 try{await scene.systems['mindar-image-system'].start();started=true;}
 catch(e){status.textContent='Kamera konnte nicht starten. Bitte HTTPS und Kamerafreigabe prüfen.';button.hidden=false;}
 finally{starting=false;}
});
scene.addEventListener('arReady',()=>{status.textContent='Kamera bereit – gedruckte Vorderseite anvisieren';});
scene.addEventListener('arError',()=>{status.textContent='AR-Fehler – Seite neu laden und Kamerazugriff erlauben';});
target.addEventListener('targetFound',()=>{found=true;status.textContent='Karte erkannt · Animation läuft';playVideo();});
target.addEventListener('targetLost',()=>{found=false;video.pause();status.textContent='Vorderseite wieder ins Bild halten';});
video.addEventListener('error',()=>{status.textContent='Video konnte nicht geladen werden – animation2_iphone.mp4 mit hochgeladen?';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause();else if(found)playVideo();});
</script></body></html>
